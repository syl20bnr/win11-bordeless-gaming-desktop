[package]
name = "win11-borderless-gaming-desktop"
version = "3.2.0"
edition = "2024"
rust-version = "1.94"
description = "A Windows desktop app for switching resolution and desktop actions for borderless gaming."
categories = ["os::windows-apis"]
keywords = ["windows", "taskbar", "desktop", "gaming", "autohide"]
license = "GPL-3.0-or-later"
readme = "../../README.md"
repository = "https://github.com/syl20bnr/win11-borderless-gaming-desktop"
homepage = "https://github.com/syl20bnr/win11-borderless-gaming-desktop"
include = [
    "src/**",
    "assets/app.ico",
    "assets/runtime/**",
    "assets/README.md",
    "build.rs",
    "../../README.md",
    "../../LICENSE*",
    "Cargo.toml",
]

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "persistence",
] }
epaint_default_fonts = "0.35.0"
image = { version = "0.25.10", default-features = false, features = [
    "png",
] }
raw-window-handle = "0.6.2"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
tray-icon = { version = "0.23.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[build-dependencies]
winres = "0.1.12"
